[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funcgenomic"
version = "0.2.0"
description = "Functional convergence atlas and ranker for crop pathogen host dependency targets."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Aakarsh Bengani" }
]

[project.scripts]
funcgenomic = "funcgenomic.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
