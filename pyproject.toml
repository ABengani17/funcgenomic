[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-host-atlas"
version = "0.1.0"
description = "Small prototype for ranking crop-pathogen host dependency targets."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Aakarsh Bengani" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
